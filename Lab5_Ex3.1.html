<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lợi ích của Công nghệ số</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #222;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #064b91;
            margin-bottom: 25px;
        }

        h2 {
            color: #064b91;
            margin-top: 30px;
        }

        .infographic {
            width: 100%;
            max-width: 700px;
            display: block;
            margin: auto;
            border-radius: 8px;
        }

        .video {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            margin-top: 15px;
        }

        .video iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }

        .source {
            margin-top: 25px;
            padding: 15px;
            background: #f1f1f1;
            border-radius: 8px;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Lợi ích của Công nghệ số</h1>

        <h2>1. Infographic</h2>

        <img
            src="infographic.png"
            alt="Infographic Lợi ích của Công nghệ số"
            class="infographic"
        >

        <h2>2. Video YouTube</h2>

        <div class="video">
            <iframe
                src="https://www.youtube.com/embed/uejGY2K0DR8"
                title="Video về công nghệ số"
                allowfullscreen>
            </iframe>
        </div>

        <div class="source">
            <h2>Nguồn</h2>

            <p>
                Infographic được tạo bởi Canva AI,
                hình ảnh từ Unsplash (Unsplash License).
            </p>

            <p>
                Trang HTML được tạo với sự hỗ trợ của AI.
            </p>
        </div>

        <footer>
            © 2026 - Lab5 - Nhiệm vụ 3.1
        </footer>

    </div>

</body>
</html>
